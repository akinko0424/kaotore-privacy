<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KAOTORE サポート</title>
  <style>
    :root{
      --bg:#f7f1e9;
      --card:#fffaf4;
      --text:#3f2a1d;
      --muted:#7c6a5d;
      --line:#decfbe;
      --accent:#9b7350;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.8;
    }
    main{
      max-width:760px;
      margin:0 auto;
      padding:56px 20px 72px;
    }
    .brand{
      letter-spacing:.22em;
      font-family:Georgia,"Times New Roman",serif;
      font-size:30px;
      margin-bottom:6px;
    }
    .sub{
      color:var(--muted);
      font-size:13px;
      letter-spacing:.12em;
      margin-bottom:32px;
    }
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:22px;
      padding:30px 26px;
      box-shadow:0 10px 28px rgba(70,45,28,.06);
    }
    h1{font-size:26px;margin:0 0 18px}
    h2{font-size:18px;margin:30px 0 8px}
    p{margin:8px 0}
    a{color:var(--accent);word-break:break-all}
    .note{color:var(--muted);font-size:14px}
    footer{
      margin-top:28px;
      color:var(--muted);
      font-size:13px;
      text-align:center;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">KAOTORE</div>
    <div class="sub">FACE TRAINING APP</div>

    <section class="card">
      <h1>サポート</h1>
      <p>KAOTOREをご利用いただきありがとうございます。</p>
      <p>アプリに関するご質問、不具合のご報告、その他のお問い合わせは、下記メールアドレスまでご連絡ください。</p>

      <h2>お問い合わせ</h2>
      <p><a href="mailto:kaotore.support@gmail.com">kaotore.support@gmail.com</a></p>
      <p class="note">内容を確認のうえ、順次対応いたします。</p>

      <h2>プライバシーポリシー</h2>
      <p><a href="https://kaotore.com/">https://kaotore.com/</a></p>

      <h2>利用規約</h2>
      <p><a href="https://kaotore.com/terms.html">https://kaotore.com/terms.html</a></p>
    </section>

    <footer>© 2026 KAOTORE</footer>
  </main>
</body>
</html>
